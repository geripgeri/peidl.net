name: Sync ADR count

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-adr-count
  cancel-in-progress: false

jobs:
  sync:
    # Pinned, not ubuntu-latest: this job auto-merges to main, so the runner OS
    # must only change in a reviewed diff, not mid-window when the label rolls
    # to Ubuntu 26.04. Flip to ubuntu-26.04 deliberately once tested.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Count ADRs in planet-express
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(gh api repos/geripgeri/planet-express/contents/docs/decisions \
            --paginate --jq '.[].name')
          N=$(printf '%s\n' "$names" | grep -cE '^ADR-.*\.md$' || true)
          case "$N" in
            ''|*[!0-9]*) echo "invalid count: $N" >&2; exit 1 ;;
          esac
          echo "adrs=$N" >> "$GITHUB_OUTPUT"

      # The page reads the live count from site-stats.json, but there is a
      # static number in the HTML for the no-JS / fetch-failure case, and the
      # README documents that number. Both are replaced here so they cannot
      # drift away from the repo. Runs before the section measurement so the
      # sizes are taken from the final bytes.
      - name: Sync ADR count into index.html and README.md
        env:
          ADRS: ${{ steps.count.outputs.adrs }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          n = os.environ["ADRS"]

          def sub(path, pattern, render, expected=1):
              s = open(path, encoding="utf-8").read()
              s2, count = pattern.subn(render, s)
              if count != expected:
                  sys.exit(f"{path}: expected {expected} match(es) for {pattern.pattern!r}, found {count}")
              open(path, "w", encoding="utf-8").write(s2)

          # index.html: the static no-JS fallback, both the data-counter value
          # and the rendered text inside the same span.
          sub(
              "index.html",
              re.compile(r'(<span data-counter=")\d+("\s+data-counter-key="adrs"[^>]*>)\d+(</span>)'),
              lambda m: f"{m.group(1)}{n}{m.group(2)}{n}{m.group(3)}",
          )

          # README.md: the same number, in the sentence that documents it.
          sub(
              "README.md",
              re.compile(r'(static `)\d+(` in the HTML)'),
              lambda m: f"{m.group(1)}{n}{m.group(2)}",
          )

          print(f"synced ADR count {n} into index.html and README.md")
          PY

      - name: Measure section sizes
        run: |
          set -euo pipefail
          sections=""
          while IFS=: read -r id start end; do
            bytes=$(sed -n "${start},${end}p" index.html | wc -c)
            bytes=$((bytes))
            if [ -n "$sections" ]; then sections="${sections},"; fi
            sections="${sections}\"${id}\":${bytes}"
          done < <(
            awk '
              /<section id="/ {
                id = $0
                sub(/.*id="/, "", id)
                sub(/".*/, "", id)
                start = NR
              }
              /<\/section>/ && start {
                printf "%s:%d:%d\n", id, start, NR
                start = 0
              }
            ' index.html
          )
          echo "{${sections}}" > sections.json
          cat sections.json

      - name: Update site-stats.json
        env:
          ADRS: ${{ steps.count.outputs.adrs }}
        run: |
          set -euo pipefail
          jq --argjson n "$ADRS" --argjson s "$(cat sections.json)" \
             '.adrs = $n | .sections = $s' \
             site-stats.json > site-stats.json.tmp
          if jq -e --slurp '.[0] == .[1]' site-stats.json site-stats.json.tmp > /dev/null; then
            echo "ADR count and section sizes unchanged ($ADRS)"
            rm site-stats.json.tmp
            exit 0
          fi
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.updated = $t' \
             site-stats.json.tmp > site-stats.json
          rm site-stats.json.tmp

      - name: Open auto-merge PR if changed
        env:
          # Use a PAT so the pull_request event isn't created by GITHUB_TOKEN
          # (GITHUB_TOKEN-created PRs make the validate check wait for approval).
          # Create a PAT with repo write + contents write, store as GH_ACTION_TOKEN.
          GH_TOKEN: ${{ secrets.GH_ACTION_TOKEN || github.token }}
          ADRS: ${{ steps.count.outputs.adrs }}
        run: |
          if git diff --quiet -- site-stats.json index.html README.md; then
            echo "nothing to sync (ADR count $ADRS already current)"
            exit 0
          fi
          BR="ci/adr-count-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add site-stats.json index.html README.md
          git commit -m "chore(stats): sync ADR count to $ADRS"
          git push -u origin "$BR"
          gh pr create --head "$BR" \
            --title "chore(stats): sync ADR count to $ADRS" \
            --body "Automated sync from [planet-express](https://github.com/geripgeri/planet-express/tree/main/docs/decisions). Updates \`site-stats.json\`, the static ADR counter in \`index.html\`, and the count documented in \`README.md\`. Auto-merge enabled, no review needed."
          gh pr merge --auto --squash --delete-branch
