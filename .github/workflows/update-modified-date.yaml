name: Sync last modified date

# Points the JSON-LD dateModified in index.html at the date a human last
# changed the page, so the freshness claim is one a crawler can check against
# git rather than one we assert.
#
# sitemap.xml carries no lastmod: it lists a single URL, so there is no
# crawl-scheduling decision for a modified date to inform.
#
# Derived from history, never from the clock. Bumping on every merge would
# claim "modified today" for merges that only touched site-stats.json or a
# workflow file, and both engines discount a lastmod that is always today.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled: two merges in quick succession must not race for the
# branch and the PR.
concurrency:
  group: sync-last-modified-date
  cancel-in-progress: false

jobs:
  # Derives the date from git history and rewrites index.html. No write access,
  # so a compromised action here cannot push or merge.
  compute:
    # closed-but-not-merged means the PR was abandoned.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    # Pinned, not ubuntu-latest: this repository auto-merges its own PRs, so the
    # runner OS must only change in a reviewed diff, not mid-window when the
    # label rolls to Ubuntu 26.04. Flip to ubuntu-26.04 deliberately once tested.
    runs-on: ubuntu-24.04
    outputs:
      html: ${{ steps.derive.outputs.html }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          # Full history, not an optimisation: in a shallow clone the boundary
          # commit appears to touch every file, so the derived value silently
          # becomes today for any path.
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the last human change from git history
        id: derive
        run: |
          set -euo pipefail
          # Three kinds of commit are not page modifications:
          #
          #  1. the bot's own freshness stamp, matched on both the author name
          #     and the committer email. An auto-merge leaves the author as
          #     github-actions[bot], but a squash merged from the UI is
          #     attributed to whoever clicked the button, so the name reads
          #     "Gergely Peidl" while the committer is always GitHub.
          #  2. commits that touch no other file, handled by the "-- $1" path.
          #  3. commits whose entire diff to the page is the dateModified line.
          #
          # Filter 3 is the self-referential one: the stamp lives in the page,
          # so every commit that rewrites it edits index.html. Filtering on the
          # path alone therefore lets the stamp cite itself, and any human
          # commit that only reformats the date string gets counted as a
          # content change. That is how a pure metadata fix claimed the page
          # had been edited today.
          #
          # "|| true" is load-bearing: grep exits 1 when every commit is
          # filtered out, and under set -e that would abort the step before
          # the check below could explain why.
          derive() {
            git log --format='%H%x09%ad%x09%an%x09%ce' --date=short --no-merges -- "$1" \
              | grep -vF 'github-actions' \
              | grep -vF 'noreply@github.com' \
              | while IFS=$'\t' read -r sha date author committer; do
                  if git show --format= --unified=0 "$sha" -- "$1" \
                       | grep -E '^[+-]' \
                       | grep -vE '^(\+\+\+|---)' \
                       | grep -qv '"dateModified"'; then
                    echo "$date"
                    break
                  fi
                done || true
          }

          HTML_DATE=$(derive index.html)
          echo "index.html last human change: ${HTML_DATE:-<none>}"

          # An empty date is worse than a stale one: it turns a real date into a
          # lie in the other direction.
          if [ -z "$HTML_DATE" ]; then
            echo "::error::could not derive a last-modified date from git history"
            exit 1
          fi

          echo "html=$HTML_DATE" >> "$GITHUB_OUTPUT"

      - name: Stamp the derived date if changed
        run: |
          set -euo pipefail
          python3 - "${{ steps.derive.outputs.html }}" <<'PY'
          import re, sys

          html_date = sys.argv[1]

          # dateModified is typed schema.org DateTime, and Google's ProfilePage
          # examples all carry a time and a UTC offset. A bare date is a valid
          # ISO 8601 date but not a DateTime, which the Rich Results Test
          # rejects as "Invalid datetime value".
          def as_datetime(day):
              return f"{day}T00:00:00+00:00"

          # git log --date=short is expected to yield YYYY-MM-DD; anything else
          # means the value is not a date and must not be written into the page.
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", html_date):
              sys.exit(f"unexpected date from git history: {html_date!r}")

          def sub(path, pattern, render):
              s = open(path, encoding="utf-8").read()
              s2, count = pattern.subn(render, s)
              if count != 1:
                  sys.exit(f"{path}: expected exactly 1 match for {pattern.pattern!r}, found {count}")
              open(path, "w", encoding="utf-8").write(s2)

          sub(
              "index.html",
              re.compile(r'("dateModified": ")\d{4}-\d{2}-\d{2}T00:00:00\+00:00(")'),
              lambda m: f"{m.group(1)}{as_datetime(html_date)}{m.group(2)}",
          )
          PY

      - name: Upload stamped page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stamped-page
          path: index.html
          retention-days: 1

  # The only credentials in this workflow are a GitHub App installation token
  # that expires after an hour and covers only this repository. Unlike
  # GITHUB_TOKEN, it triggers the validate workflow, so auto-merge can resolve.
  publish:
    needs: compute
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          token: ${{ steps.app.outputs.token }}

      - name: Download stamped page
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stamped-page

      - name: Open an auto-merge PR if changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # On pull_request, GITHUB_REF_NAME is the PR number, not the branch.
          BASE: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HTML_DATE: ${{ needs.compute.outputs.html }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "dates already match git history (index.html $HTML_DATE), nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="ci/last-modified-$(date -u +%Y%m%d-%H%M)"
          # Detached HEAD at the merge commit; branch so the stamp lands on top
          # of the merge. main requires the validate check, so this cannot be a
          # direct push.
          git checkout -b "$BR"
          git add index.html
          git commit -m "chore(seo): sync last modified date to $HTML_DATE"
          git push origin HEAD:"$BR"
          gh pr create --base "$BASE" --head "$BR" \
            --title "chore(seo): sync last modified date to $HTML_DATE" \
            --body "Automated freshness stamp: \`dateModified\` in \`index.html\` set to \`$HTML_DATE\`, the date of the last commit that changed the page, taken from git history rather than the clock. Auto-merge enabled, no review needed."
          # This merge closes a PR, which runs the workflow again; the second
          # pass derives the same date, finds no diff and opens nothing.
          gh pr merge --auto --squash --delete-branch
